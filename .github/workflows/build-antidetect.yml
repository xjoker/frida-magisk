name: Build antidetect module

on:
  push:
    tags:
      - v*-antidetect
  workflow_dispatch:
    inputs:
      antidetect_version:
        description: Antidetect asset version to package
        required: true
        default: 17.9.1
      asset_release_tag:
        description: Optional release tag in this repository containing owned antidetect assets
        required: false
        default: ""
      asset_archive_name:
        description: Owned asset archive name; supports {version}
        required: false
        default: "frida-antidetect-assets-{version}.tar.xz"
      allow_unverified:
        description: Allow assets without SHA-256 verification
        required: true
        type: boolean
        default: false
      publish_release:
        description: Publish or update GitHub Release v<version>-antidetect
        required: true
        type: boolean
        default: false
      profile_overrides:
        description: Optional KEY=VALUE lines applied before the ANTIDETECT_PROFILE secret
        required: false
        default: ""

# Least privilege by default; only the publish job gets contents: write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      frida_version: ${{ steps.version.outputs.frida_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      asset_source: ${{ steps.build.outputs.asset_source }}
      allow_unverified: ${{ steps.version.outputs.allow_unverified }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve antidetect version
        id: version
        env:
          CONFIGURED_ANTIDETECT_VERSION: ${{ vars.ANTIDETECT_VERSION }}
          INPUT_ANTIDETECT_VERSION: ${{ inputs.antidetect_version }}
          INPUT_ALLOW_UNVERIFIED: ${{ inputs.allow_unverified }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_ANTIDETECT_VERSION:-}"
          if [[ -z "$version" && "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v*-antidetect ]]; then
            version="${GITHUB_REF_NAME#v}"
            version="${version%-antidetect}"
          fi
          if [[ -z "$version" ]]; then
            version="$CONFIGURED_ANTIDETECT_VERSION"
          fi
          if [[ -z "$version" ]]; then
            echo "antidetect_version input or ANTIDETECT_VERSION repository variable is required." >&2
            exit 1
          fi
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported antidetect version: $version" >&2
            exit 1
          fi

          echo "frida_version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version-antidetect" >> "$GITHUB_OUTPUT"
          echo "FRIDA_VERSION=$version" >> "$GITHUB_ENV"
          echo "ANTIDETECT_VERSION=$version" >> "$GITHUB_ENV"
          echo "FRIDA_PACKAGE_FLAVOR=antidetect" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version-antidetect" >> "$GITHUB_ENV"

          if [[ "${INPUT_ALLOW_UNVERIFIED:-}" == "true" ]]; then
            echo "ANTIDETECT_ALLOW_UNVERIFIED=1" >> "$GITHUB_ENV"
            echo "allow_unverified=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Using antidetect asset version $version"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip unzip xz-utils curl gzip

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The default list includes the legacy `tools` package, which Google removed
          # from the SDK repository (sdkmanager: "Failed to find package 'tools'").
          packages: platform-tools

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          # `yes` gets SIGPIPE once sdkmanager exits; only sdkmanager's status matters.
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build antidetect module
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ASSET_RELEASE_TAG: ${{ inputs.asset_release_tag }}
          INPUT_ASSET_ARCHIVE_NAME: ${{ inputs.asset_archive_name }}
          INPUT_PROFILE_OVERRIDES: ${{ inputs.profile_overrides }}
          SECRET_ANTIDETECT_PROFILE: ${{ secrets.ANTIDETECT_PROFILE }}
          CONFIGURED_ASSET_RELEASE_TAG: ${{ vars.ANTIDETECT_ASSET_RELEASE_TAG }}
          CONFIGURED_ASSET_ARCHIVE_NAME: ${{ vars.ANTIDETECT_ASSET_ARCHIVE_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/antidetect-profile.env"
          : > "$profile"
          if [[ -n "$INPUT_PROFILE_OVERRIDES" ]]; then
            printf '%s\n' "$INPUT_PROFILE_OVERRIDES" >> "$profile"
          fi
          if [[ -n "$SECRET_ANTIDETECT_PROFILE" ]]; then
            printf '%s\n' "$SECRET_ANTIDETECT_PROFILE" >> "$profile"
          fi
          chmod 0600 "$profile"
          if [[ -s "$profile" ]]; then
            export ANTIDETECT_PROFILE_FILE="$profile"
          fi

          export FRIDA_ASSET_DIR="$PWD/assets/antidetect"
          asset_release_tag="${INPUT_ASSET_RELEASE_TAG:-$CONFIGURED_ASSET_RELEASE_TAG}"
          if [[ -n "$asset_release_tag" ]]; then
            echo "asset_source=owned" >> "$GITHUB_OUTPUT"
            archive_pattern="${INPUT_ASSET_ARCHIVE_NAME:-${CONFIGURED_ASSET_ARCHIVE_NAME:-frida-antidetect-assets-{version}.tar.xz}}"
            archive_name="${archive_pattern//\{version\}/$ANTIDETECT_VERSION}"
            mkdir -p "$PWD/build/antidetect-assets"
            gh release download "$asset_release_tag" \
              --pattern "$archive_name" \
              --dir "$PWD/build/antidetect-assets"
            # Expected archive hash comes from antidetect/hashes.sha256 committed in this repo
            # (fail-closed in prepare-antidetect-assets.sh), not from the asset release.
            export ANTIDETECT_ASSET_ARCHIVE="$PWD/build/antidetect-assets/$archive_name"
            bash scripts/prepare-antidetect-assets.sh
          else
            echo "asset_source=official-baseline" >> "$GITHUB_OUTPUT"
            echo "No owned antidetect asset archive configured; using official Frida assets (digest-verified) as baseline input."
            scripts/fetch-frida-assets.sh
          fi
          scripts/build-zygisk-injector.sh
          read -r -a module_abis <<<"${MODULE_ABIS:-universal arm64-v8a armeabi-v7a x86 x86_64}"
          for abi in "${module_abis[@]}"; do
            MODULE_ABI="$abi" scripts/build-module.sh
          done
          for zip in dist/frida-magisk-antidetect-*.zip; do
            scripts/verify-antidetect-package.sh "$zip"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frida-magisk-antidetect-${{ env.FRIDA_VERSION }}
          path: |
            dist/frida-magisk-antidetect-*.zip
            dist/frida-magisk-antidetect-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    # Never publish from forks or non-default branches (tags are allowed).
    if: >-
      github.repository == 'xjoker/frida-magisk' &&
      (startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_release &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frida-magisk-antidetect-${{ needs.build.outputs.frida_version }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FRIDA_VERSION: ${{ needs.build.outputs.frida_version }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          ANTIDETECT_ASSET_SOURCE: ${{ needs.build.outputs.asset_source }}
          ALLOW_UNVERIFIED: ${{ needs.build.outputs.allow_unverified }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s failglob
          tag="$RELEASE_TAG"
          notes="Automated frida-magisk antidetect build for asset version $FRIDA_VERSION."
          if [[ "${ANTIDETECT_ASSET_SOURCE:-}" == "owned" ]]; then
            notes="$notes"$'\n\n'"Assets use this repository's owned antidetect server and Gadget build outputs, plus this repository's Zygisk injector and module template."
          else
            notes="$notes"$'\n\n'"No owned antidetect asset archive was configured for this run. The package uses official Frida server and Gadget assets as baseline inputs, then applies this repository's module, Zygisk, path, port, and filename profile."
            notes="$notes"$'\n\n'"This baseline validates the automated packaging chain and static package surface rewrite. It does not make server or Gadget binary internals target-hardened; binary-level behavior still requires supplying owned antidetect assets."
          fi
          notes="$notes"$'\n\n'"This build reduces common static Frida surfaces but is not a guarantee against target-specific anti-tamper checks."
          if [[ "${ALLOW_UNVERIFIED:-}" == "true" ]]; then
            notes="$notes"$'\n\n'"Note: antidetect assets were downloaded without SHA-256 verification."
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "$notes"
            gh release upload "$tag" dist/frida-magisk-antidetect-*.zip dist/frida-magisk-antidetect-*.zip.sha256 --clobber
          else
            gh release create "$tag" dist/frida-magisk-antidetect-*.zip dist/frida-magisk-antidetect-*.zip.sha256 \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "$notes"
          fi
